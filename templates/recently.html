<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stoichio – Recently</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
  </head>

  <body>
    {% include "_nav.html" %}

    <main class="container-fluid px-4 py-5">
      <div class="mx-auto" style="max-width: 1100px;">
        <div class="mb-4">
          <h1 class="mb-1">Recently</h1>
          <p class="text-muted mb-0">Weekly notes on chemistry discoveries in simple terms.</p>
        </div>

        <!-- Most recent posts -->
        {% for post in posts %}
        <div class="card shadow-sm {% if not loop.last %}mb-4{% endif %}">
          <div class="card-body p-4 p-md-5">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-2 mb-3">
              <span class="badge text-bg-primary align-self-start">Research</span>
              <small class="text-muted">{{ post['date'] }}</small>
            </div>
            <h2 class="h3 mb-3">
              <a class="text-decoration-none text-dark" href="{{ url_for('post', post_id=post['id']) }}">{{ post['title'] }}</a>
            </h2>
            <p class="mb-0">{{ post['summary'] }}</p>
          </div>
        </div>
        {% else %}
        <p class="text-muted">No posts yet.</p>
        {% endfor %}

        <!-- One archive button at bottom - access to old posts -->
        <div class="mt-5 text-center">
          <a href="/archive" class="btn btn-outline-secondary btn-lg">View archive of past posts</a>
        </div>
      </div>
    </main>

    <footer class="bg-white">
      <div class="container py-4 text-center">© Luisa 2025</div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
