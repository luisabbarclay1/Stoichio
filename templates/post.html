<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stoichio – {{ post['title'] }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
  </head>

  <body>
    {% include "_nav.html" %}

    <main class="container-fluid px-4 py-5">
      <div class="mx-auto" style="max-width: 900px;">
        <div class="card shadow-sm">
          <div class="card-body p-4 p-md-5">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-2 mb-3">
              <span class="badge text-bg-primary align-self-start">Research</span>
              <small class="text-muted">{{ post['date'] }}</small>
            </div>
            <h1 class="h3 mb-3">{{ post['title'] }}</h1>
            <p class="mb-0">{{ post['summary'] }}</p>
          </div>
        </div>

        <div class="mt-4">
          <a class="btn btn-outline-secondary" href="{{ url_for('archive') }}">Back to archive</a>
        </div>
      </div>
    </main>

    <footer class="bg-white">
      <div class="container py-4 text-center">© Luisa 2025</div>
    </footer>
  </body>
</html>
